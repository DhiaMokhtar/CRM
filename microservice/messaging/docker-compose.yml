version: '3.8'

services:
  mysql_messaging:
    image: mysql:8.0
    container_name: mysql_messaging
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: messaging_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_messaging_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  messaging_service:
    build: .
    container_name: messaging_service
    environment:
      - SECRET_KEY=django-insecure-1+e#)73aknts5v9id(oqr#*dg2_pqzk86h-zrq^5^15s_v&&1%
      - DEBUG=True
      - DB_NAME=messaging_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_messaging
      - DB_PORT=3306
    ports:
      - "8003:8000"
    volumes:
      - ../../certs:/certs-in:ro
    depends_on:
      mysql_messaging:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_messaging_data:

networks:
  crm_network:
    external: true
    name: crm_network