version: '3.8'

services:
  mysql_messaging:
    image: mysql:8.0
    container_name: mysql_messaging
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: messaging_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_messaging_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  messaging_service:
    build: .
    container_name: messaging_service
    environment:
      - SECRET_KEY=django-insecure-1+e#)73aknts5v9id(oqr#*dg2_pqzk86h-zrq^5^15s_v&&1%
      - DEBUG=True
      - DB_NAME=messaging_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_messaging
      - DB_PORT=3306
    ports:
      - "8003:8000"
    volumes:
      - ../../localhost.pem:/certs-in/localhost.pem:ro
      - ../../localhost-key.pem:/certs-in/localhost-key.pem:ro
    depends_on:
      mysql_messaging:
        condition: service_healthy
    command: >
      sh -c "
        set -e
        echo 'DNS & port check...' &&
        getent hosts mysql_messaging || true &&
        (apk add --no-cache busybox-extras 2>/dev/null || true; nc -vz mysql_messaging 3306 || true) &&
        echo 'Waiting for MySQL...' &&
        for i in $(seq 1 40); do
          if mysqladmin ping -h mysql_messaging -u root -ppassword --silent; then
            echo 'mysqld is alive'; break; fi;
          echo \"[Attempt $i] MySQL not ready\"; sleep 2;
        done &&
        mysqladmin ping -h mysql_messaging -u root -ppassword --silent || { echo 'MySQL never ready'; exit 1; } &&
        echo 'Making migrations...' && python manage.py makemigrations &&
        echo 'Running migrations...' && python manage.py migrate &&
        mkdir -p /app/ssl &&
        rm -f /app/ssl/localhost.pem /app/ssl/localhost-key.pem &&
        if [ -f /certs-in/localhost.pem ] && [ -f /certs-in/localhost-key.pem ]; then
          install -m 600 /certs-in/localhost.pem /app/ssl/localhost.pem &&
          install -m 600 /certs-in/localhost-key.pem /app/ssl/localhost-key.pem;
        else
          echo 'Generating self-signed cert' &&
          openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
            -keyout /app/ssl/localhost-key.pem \
            -out /app/ssl/localhost.pem \
            -subj '/CN=localhost';
        fi &&
        ls -la /app/ssl &&
        python manage.py runsslserver 0.0.0.0:8000 --certificate /app/ssl/localhost.pem --key /app/ssl/localhost-key.pem
      "

volumes:
  mysql_messaging_data:

networks:
  crm_network:
    external: true
    name: crm_network