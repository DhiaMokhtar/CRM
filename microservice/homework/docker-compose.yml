version: '3.8'

services:
  mysql_homework:
    image: mysql:8.0
    container_name: mysql_homework
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: homework_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3310:3306"
    volumes:
      - mysql_homework_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  homework_service:
    build: .
    container_name: homework_service
    env_file:
      - ../../.env
    environment:
      - DB_NAME=homework_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_homework
      - DB_PORT=3306
    ports:
      - "8004:8000"
    volumes:
      - ./media:/app/media
      - ../../certs:/certs-in:ro
    depends_on:
      mysql_homework:
        condition: service_healthy
    networks:
      - crm_network
    restart: unless-stopped

volumes:
  mysql_homework_data:

networks:
  crm_network:
    external: true
    name: crm_network