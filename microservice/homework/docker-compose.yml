version: '3.8'

services:
  mysql_homework:
    image: mysql:8.0
    container_name: mysql_homework
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: homework_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3310:3306"
    volumes:
      - mysql_homework_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  homework_service:
    build: .
    container_name: homework_service
    environment:
      - SECRET_KEY=django-insecure-1+e#)73aknts5v9id(oqr#*dg2_pqzk86h-zrq^5^15s_v&&1%
      - DEBUG=True
      - DB_NAME=homework_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_homework
      - DB_PORT=3306
    ports:
      - "8004:8000"
    volumes:
      - ./media:/app/media
      - ../../localhost.pem:/app/ssl/localhost.pem:ro
      - ../../localhost-key.pem:/app/ssl/localhost-key.pem:ro
    depends_on:
      mysql_homework:
        condition: service_healthy
    networks:
      - crm_network
    external_links:
      - users_service:users_service
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for MySQL to be ready...' &&
        while ! mysqladmin ping -h mysql_homework -u root -pcrm_password --silent; do
          echo 'Waiting for MySQL...' && sleep 2
        done &&
        echo 'MySQL is ready!' &&
        # Fix broken migration chain if 0001 is missing but later files exist
        if [ ! -f homework/migrations/0001_initial.py ] && ls homework/migrations/0002_* >/dev/null 2>&1; then
          echo 'Fixing broken migrations chain...' &&
          find homework/migrations -type f -name '0*.py' ! -name '__init__.py' -delete &&
          python manage.py makemigrations homework
        fi &&
        echo 'Making migrations...' && python manage.py makemigrations &&
        echo 'Running migrations...' && python manage.py migrate &&
        echo 'Checking SSL certificates...' && ls -la /app/ssl &&
        [ -f /app/ssl/localhost.pem ] && [ -f /app/ssl/localhost-key.pem ] || (echo 'SSL cert/key missing or not files' && exit 1) &&
        echo 'Starting Django server with HTTPS...' &&
        python manage.py runsslserver 0.0.0.0:8000 --certificate /app/ssl/localhost.pem --key /app/ssl/localhost-key.pem
      "

volumes:
  mysql_homework_data:

networks:
  crm_network:
    external: true
    name: crm_network