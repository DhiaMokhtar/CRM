version: '3.8'

services:
  mysql_homework:
    image: mysql:8.0
    container_name: mysql_homework
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: crm_password
      MYSQL_DATABASE: homework_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3310:3306"
    volumes:
      - mysql_homework_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "crm_user", "-pcrm_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  homework_service:
    build: .
    container_name: homework_service
    environment:
      - DB_NAME=homework_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_password
      - DB_HOST=mysql_homework
      - DB_PORT=3306
      - DEBUG=True
    depends_on:
      mysql_homework:
        condition: service_healthy
    ports:
      - "8004:8000"
    networks:
      - crm_network
    restart: unless-stopped
    command: >
      sh -c "
        echo '[homework] Waiting for DB...' &&
        for i in $(seq 1 40); do
          if mysqladmin ping -h $DB_HOST -u $DB_USER -p$DB_PASSWORD --silent; then
            echo '[homework] DB up'; break;
          fi;
          echo [homework] attempt $i/40; sleep 2;
        done &&
        mysql -h $DB_HOST -u $DB_USER -p$DB_PASSWORD -e 'SELECT 1' $DB_NAME || { echo '[homework] FATAL: cannot run simple query'; exit 1; } &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

volumes:
  mysql_homework_data:

networks:
  crm_network:
    external: true