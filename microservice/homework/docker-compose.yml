version: '3.8'

services:
  mysql_homework:
    image: mysql:8.0
    container_name: mysql_homework
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: homework_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3310:3306"
    volumes:
      - mysql_homework_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    command: --default-authentication-plugin=mysql_native_password

  homework_service:
    build: .
    container_name: homework_service
    environment:
      - SECRET_KEY=django-insecure-1+e#)73aknts5v9id(oqr#*dg2_pqzk86h-zrq^5^15s_v&&1%
      - DEBUG=True
      - DB_NAME=homework_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_homework
      - DB_PORT=3306
    ports:
      - "8003:8000"
    volumes:
      - ./media:/app/media
      - ../../certs:/certs-in:ro
    depends_on:
      mysql_homework:
        condition: service_healthy
    networks:
      - crm_network
    restart: unless-stopped

  users_service:
    ports:
      - "8001:8000"  # External:Internal
    networks:
      - crm_network

  courses_service:
    ports:
      - "8002:8000"
    networks:
      - crm_network

  messaging_service:
    ports:
      - "8004:8000"
    networks:
      - crm_network

volumes:
  mysql_homework_data:

networks:
  crm_network:
    external: true
    name: crm_network