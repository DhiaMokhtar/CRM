version: '3.8'

services:
  mysql_users:
    image: mysql:8.0
    container_name: mysql_users
    environment:
      MYSQL_ROOT_PASSWORD: crm_password
      MYSQL_DATABASE: users_db                # unified name
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucrm_user -pcrm_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s

  users_service:
    build: .
    container_name: users_service
    env_file:
      - .env
    environment:
      - DB_NAME=users_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_password
      - DB_HOST=mysql_users
      - DB_PORT=3306
    depends_on:
      mysql_users:
        condition: service_healthy
    volumes:
      - ../../certs:/certs-in:ro
    ports:
      - "8001:8000"
    networks:
      - crm_network
    restart: unless-stopped

volumes:
  mysql_users_data:

networks:
  crm_network:
    external: true
    name: crm_network