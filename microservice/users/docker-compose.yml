version: '3.8'

services:
  mysql_users:
    image: mysql:8.0
    container_name: mysql_users
    environment:
      MYSQL_ROOT_PASSWORD: crm_password
      MYSQL_DATABASE: crm_users
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pcrm_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  users_service:
    build: .
    container_name: users_service
    environment:
      - DB_HOST=mysql_users
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=crm_password
    volumes:
      - ../../certs:/certs-in:ro
    ports:
      - "8001:8000"
    depends_on:
      mysql_users:
        condition: service_healthy
    networks:
      - crm_network

volumes:
  mysql_users_data:

networks:
  crm_network:
    external: true
    name: crm_network