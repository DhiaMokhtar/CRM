version: '3.8'

services:
  mysql_users:
    image: mysql:8.0
    container_name: mysql_users
    environment:
      MYSQL_ROOT_PASSWORD: crm_password
      MYSQL_DATABASE: crm_users
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pcrm_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  users_service:
    build: .
    container_name: users_service
    environment:
      - DB_HOST=mysql_users
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=crm_password
    ports:
      - "8001:8000"
    depends_on:
      mysql_users:
        condition: service_healthy
    volumes:
      - ../../localhost.pem:/certs-in/localhost.pem:ro
      - ../../localhost-key.pem:/certs-in/localhost-key.pem:ro
      - ./media:/app/media
    command: >
      sh -c "
        echo 'Waiting for MySQL to be ready...' &&
        until mysqladmin ping -h mysql_users -u root -pcrm_password --silent; do
          echo 'Waiting for MySQL...' && sleep 2
        done &&
        echo 'MySQL is ready!' &&
        echo 'Making migrations...' && python manage.py makemigrations &&
        echo 'Running migrations...' && python manage.py migrate &&
        echo 'Preparing SSL certs...' &&
        mkdir -p /app/ssl &&
        rm -f /app/ssl/localhost.pem /app/ssl/localhost-key.pem &&
        if [ -f /certs-in/localhost.pem ] && [ -f /certs-in/localhost-key.pem ]; then
           install -m 600 /certs-in/localhost.pem /app/ssl/localhost.pem &&
           install -m 600 /certs-in/localhost-key.pem /app/ssl/localhost-key.pem;
        else
           echo 'Mounted certs missing -> generating self-signed cert' &&
           openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
             -keyout /app/ssl/localhost-key.pem \
             -out /app/ssl/localhost.pem \
             -subj '/CN=localhost';
        fi &&
        ls -la /app/ssl &&
        echo 'Starting Django server with HTTPS...' &&
        python manage.py runsslserver 0.0.0.0:8000 --certificate /app/ssl/localhost.pem --key /app/ssl/localhost-key.pem
      "

volumes:
  mysql_users_data:

networks:
  crm_network:
    external: true
    name: crm_network