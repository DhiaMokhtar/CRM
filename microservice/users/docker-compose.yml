version: '3.8'

services:
  mysql_users:
    image: mysql:8.0
    container_name: mysql_users
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-crm_password}
      MYSQL_DATABASE: crm_users
    ports:
      - "3307:3306"
    volumes:
      - mysql_users_data:/var/lib/mysql
    networks:
      - crm_network

  users_service:
    build: .
    container_name: users_service
    environment:
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-crm_password}
    ports:
      - "8001:8000"
    volumes:
      - ../../localhost.pem:/app/ssl/localhost.pem:ro
      - ../../localhost-key.pem:/app/ssl/localhost-key.pem:ro
    networks:
      - crm_network

volumes:
  mysql_users_data:

networks:
  crm_network:
    external: true
    name: crm_network