version: '3.8'

services:
  mysql_users:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: crm_password
      MYSQL_DATABASE: users_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3307:3306"  # Changed to avoid conflict with host MySQL
    volumes:
      - mysql_users_data:/var/lib/mysql
    networks:
      - crm_network
    command: --default-authentication-plugin=mysql_native_password

  users_service:
    build:
      context: .
      dockerfile: Dockerfile
    image: users_users_service:latest
    ports:
      - "8001:8000"
    depends_on:
      - mysql_users
    environment:
      - DB_HOST=mysql_users
      - DB_USER=crm_user
      - DB_PASSWORD=crm_password
      - DB_NAME=users_db
      - ROOT_PASSWORD=crm_password
    volumes:
      - ../../certs:/certs-in:ro
    networks:
      - crm_network
    restart: unless-stopped

volumes:
  mysql_users_data:

networks:
  crm_network:
    external: true