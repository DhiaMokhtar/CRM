version: '3.8'

services:
  mysql_courses:
    image: mysql:8.0
    container_name: mysql_courses
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: courses_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_courses_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  courses_service:
    build: .
    container_name: courses_service
    environment:
      - SECRET_KEY=django-insecure-courses-key
      - DEBUG=True
      - DB_NAME=courses_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_courses
      - DB_PORT=3306
    ports:
      - "8002:8000"
    volumes:
      - ../../certs:/certs-in:ro
      - ./fileCourses:/app/fileCourses
      - ./media:/app/media
    depends_on:
      mysql_courses:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_courses_data:

networks:
  crm_network:
    external: true
    name: crm_network