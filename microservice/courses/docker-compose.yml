version: '3.8'

services:
  mysql_courses:
    image: mysql:8.0
    container_name: mysql_courses
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: courses_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_courses_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  courses_service:
    build: .
    container_name: courses_service
    environment:
      - SECRET_KEY=django-insecure-courses-key
      - DEBUG=True
      - DB_NAME=courses_db
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_HOST=mysql_courses
      - DB_PORT=3306
    ports:
      - "8002:8000"
    volumes:
      - ./fileCourses:/app/fileCourses
      - ./media:/app/media
      - ../../certs:/certs-in:ro
    command: >
      sh -c "
        echo 'Waiting for MySQL to be ready...' &&
        while ! mysqladmin ping -h mysql_courses -u root -ppassword --silent; do
          echo 'Waiting for MySQL...' && sleep 2
        done &&
        echo 'MySQL is ready!' &&
        echo 'Making migrations...' && python manage.py makemigrations &&
        echo 'Running migrations...' && python manage.py migrate &&
        echo 'Collecting static files...' && python manage.py collectstatic --noinput &&
        echo 'Creating data directories...' && mkdir -p /app/fileCourses /app/media /app/ssl &&
        echo 'Listing mounted certs dir (if any)...' && ls -la /certs-in || true &&
        echo 'Preparing SSL certs (copy or generate)...' &&
        rm -f /app/ssl/localhost.pem /app/ssl/localhost-key.pem &&
        if [ -f /certs-in/localhost.pem ] && [ -f /certs-in/localhost-key.pem ]; then
           install -m 600 /certs-in/localhost.pem /app/ssl/localhost.pem &&
           install -m 600 /certs-in/localhost-key.pem /app/ssl/localhost-key.pem;
        else
           echo 'Mounted certs missing -> generating self-signed cert' &&
           openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
             -keyout /app/ssl/localhost-key.pem \
             -out /app/ssl/localhost.pem \
             -subj '/CN=localhost';
        fi &&
        ls -la /app/ssl &&
        echo 'Starting Django server with HTTPS...' &&
        python manage.py runsslserver 0.0.0.0:8000 --certificate /app/ssl/localhost.pem --key /app/ssl/localhost-key.pem
      "

volumes:
  mysql_courses_data:

networks:
  crm_network:
    external: true
    name: crm_network