version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crm-frontend-dev
    ports:
      - "4200:4200"
      - "49153:49153"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.angular
      - ../certs:/app/ssl:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - NG_CLI_ANALYTICS=false
    networks:
      - crm_network
    restart: unless-stopped
    stdin_open: true
    tty: true

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-frontend-prod
    ports:
      - "8006:80"
      - "8444:443"
    volumes:
      - ../certs:/etc/nginx/ssl:ro
    networks:
      - crm_network
    restart: unless-stopped

networks:
  crm_network:
    external: true
    name: crm_network